name: Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 1,15 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # to fail on error in multiline statements (-e), in pipes (-o pipefail), and on unset variables (-u).
    shell: bash -euo pipefail {0}

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13" # for 3.14 CI wait for https://github.com/pytorch/pytorch/issues/156856
          - os: ubuntu-latest
            python: "3.13"
            pip-flags: "--pre"
            name: PRE-RELEASE DEPENDENCIES
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.name }} Python ${{ matrix.python }}

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml

      # Example datasets fetched by the tests (pooch.os_cache("sparrow")); shared by all matrix jobs.
      # The key changes with the registry; restore-keys reuses the previous cache, and pooch re-checks hashes.
      - name: Cache example datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/sparrow
          key: harpy-datasets-${{ hashFiles('src/harpy/datasets/registry.py') }}
          restore-keys: harpy-datasets-

      - name: Sync env (locked, --lock makes it fail immediatelly if uv.lock out of date with pyproject.toml)
        run: uv sync --locked --extra dev --extra cellpose3 --python ${{ matrix.python }}

      - name: run tests using uv and pytest (locked, no sync)
        env:
          MPLBACKEND: agg
          PLATFORM: ${{ matrix.os }}
          DISPLAY: :42
        # -n auto: one pytest-xdist worker per CPU; worksteal rebalances uneven test durations
        run: uv run --no-sync pytest -n auto --dist worksteal --cov harpy --cov-branch --cov-report=xml src/harpy/_tests

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: saeyslab/harpy
