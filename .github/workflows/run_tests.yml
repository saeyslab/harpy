name: Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 1,15 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # to fail on error in multiline statements (-e), in pipes (-o pipefail), and on unset variables (-u).
    shell: bash -euo pipefail {0}

jobs:
  test:
    strategy:
      # Run every job to the end, so that a failing stable job can be told apart from a failing locked one.
      fail-fast: false
      matrix:
        # The lowest and highest supported Python versions, each with two dependency sets:
        # locked, the environment of uv.lock, and stable, the newest versions that pyproject.toml allows,
        # as a fresh pip install gets them. A stable job failing while its locked one passes points at an
        # upstream release rather than a change in Harpy.
        include:
          - os: ubuntu-latest
            python: "3.12"
            deps: locked
          - os: ubuntu-latest
            python: "3.12"
            deps: stable
          - os: ubuntu-latest
            python: "3.13" # for 3.14 CI wait for https://github.com/saeyslab/harpy/issues/269 (crick)
            deps: locked
          - os: ubuntu-latest
            python: "3.13"
            deps: stable
    runs-on: ${{ matrix.os }}

    name: Python ${{ matrix.python }} (${{ matrix.deps }})

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml

      # Example datasets fetched by the tests (pooch.os_cache("sparrow")); shared by all matrix jobs.
      # The key changes with the registry; restore-keys reuses the previous cache, and pooch re-checks hashes.
      - name: Cache example datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/sparrow
          key: harpy-datasets-${{ hashFiles('src/harpy/datasets/registry.py') }}
          restore-keys: harpy-datasets-

      # Pretrained models that cellpose downloads on first use (~/.cellpose/models); shared by all matrix jobs.
      # The key changes with the segmentation tests, which choose the models; restore-keys reuses the previous
      # cache, and cellpose only downloads the models that are missing.
      - name: Cache cellpose models
        uses: actions/cache@v4
        with:
          path: ~/.cellpose/models
          key: cellpose3-models-${{ hashFiles('src/harpy/_tests/test_image/test_segmentation/test_segmentation.py') }}
          restore-keys: cellpose3-models-

      # locked: --locked fails immediately if uv.lock is out of date with pyproject.toml.
      # stable: --upgrade re-resolves to the newest allowed versions, keeping the [tool.uv] overrides,
      # and changes uv.lock only in this checkout.
      - name: Sync env (${{ matrix.deps }})
        run: uv sync ${{ matrix.deps == 'locked' && '--locked' || '--upgrade' }} --extra dev --extra cellpose3 --python ${{ matrix.python }}

      - name: List installed package versions
        run: uv pip list

      - name: run tests using uv and pytest (no sync)
        env:
          MPLBACKEND: agg
          PLATFORM: ${{ matrix.os }}
          DISPLAY: :42
        # -n auto: one pytest-xdist worker per CPU; worksteal rebalances uneven test durations
        run: uv run --no-sync pytest -n auto --dist worksteal --cov harpy --cov-branch --cov-report=xml src/harpy/_tests

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: saeyslab/harpy
